<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .glow-aura {
            background: radial-gradient(circle at center, rgba(255, 184, 116, 0.15) 0%, rgba(10, 10, 10, 0) 70%);
        }

        .text-reveal {
            opacity: 0;
            transform: translateY(10px);
            animation: reveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes reveal {
            to {

                transform: translateY(0);
            }
        }

        }

        }

<body class="bg-background text-on-background min-h-screen overflow-hidden font-body-md selection:bg-primary/30">
<!-- Ambient Background Glow -->
<div class="fixed inset-0 glow-aura pointer-events-none"></div>
<!-- Main Alarm Container -->
<main class="relative z-10 flex flex-col h-screen max-w-[800px] mx-auto px-container-padding-mobile">

</div>
<div class="mt-element-gap text-center space-y-2">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary-fixed-dim">
                    Good Morning, Mithun.
                </h1>
<p class="font-headline-md text-headline-md-mobile md:text-headline-md text-on-surface-variant/80">
                    Time to shine.
                </p>
</div>
</section>
<!-- Bottom Half: Controls & Info -->
<section class="pb-16 flex flex-col gap-8">
<!-- Today's Plan (Animated Reveal) -->
<div class="space-y-3 bg-surface-container-low/40 backdrop-blur-sm p-6 rounded-xl border border-outline-variant/30" id="plan-container">
<div class="flex items-center gap-2 text-on-primary-fixed-variant">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
<span class="font-label-caps text-label-caps uppercase tracking-widest">Today's Focus</span>
</div>
<div class="space-y-4">
<p class="text-reveal font-body-lg text-body-lg text-on-surface leading-relaxed" style="animation-delay: 0.5s;">
                        We’re starting with a <span class="text-primary font-semibold">20-min cardio blast</span> to wake up the system.
                    </p>
<p class="text-reveal font-body-md text-body-md text-on-surface-variant" style="animation-delay: 1.5s;">
                        Your first meeting is at 10:00 AM. You've got plenty of time for a steady recovery.
                    </p>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-4">
<!-- Primary Action -->
<button class="w-full h-touch-target-min bg-primary text-on-primary font-headline-md text-headline-md-mobile rounded-xl transition-all duration-300 active:scale-95 btn-active-glow flex items-center justify-center gap-3">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">wb_sunny</span>
                    I'M UP
                </button>
<!-- Secondary Action -->
<button class="w-full h-touch-target-min border border-outline text-on-surface-variant font-headline-md text-headline-md-mobile rounded-xl transition-all duration-300 hover:bg-surface-variant/20 active:scale-95 flex items-center justify-center gap-3">
<span class="material-symbols-outlined">snooze</span>

                </button>
